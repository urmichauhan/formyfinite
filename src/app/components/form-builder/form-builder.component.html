<!-- Toolbar with Icons in Tabular View -->
<div class="container" [formGroup]="formMaker">
  <div class="">
    <div class="row">
      <div class="text-center center-block col-md-7">
        <label class="form-label">Form Details</label>
        <input type="text" class="form-control" placeholder="Enter Form Title">
        <textarea class="form-control" placeholder="Enter Form Description" rows="3"></textarea>
      </div>
    </div>

    <div class="toolbar">
      <div class="row-main width20">
        <div class="opt" *ngFor="let type of controlTypes;let i=index;">
          <button class="btn tool-button btTool" (mouseenter)="type.showAdd = true" (mouseleave)="type.showAdd = false"
            (click)="openControlConfig(type)">
            <i class="{{type.iconClass}}"></i> {{type?.fieldName}}
            <div><i *ngIf="type?.showAdd" class="fas fa-regular fa-circle-plus"></i></div>
          </button>
        </div>

      </div>


      <div class="row-main width75" formArrayName="arrayForm">
        <div class="card w-75 h-200" *ngFor="let field of arrayForm.controls">
          <div class="card-body">
            <h5 class="card-title">{{field?.value?.type}}</h5>
            <p class="card-text"><textarea class="form-control" placeholder="Enter your question" rows="3"></textarea>
            </p>
            <!-- <a href="#" class="btn btn-primary">Button</a> -->
          </div>
        </div>
      </div>


      <div *ngIf="false" class="row-main">
        <!-- email -->
        <div class="mb-3">
          <label for="exampleFormControlInput1" class="form-label">Email address</label>
          <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com">
        </div>
        <!-- text -->
        <div class="mb-3">
          <label class="form-label">Text</label>
          <input type="text" class="form-control" placeholder="text">
        </div>
        <!-- textarea -->
        <div class="mb-3">
          <label for="exampleFormControlTextarea1" class="form-label">Example textarea</label>
          <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
        </div>
        <!-- password -->
        <div class="mb-3">
          <label for="inputPassword5" class="form-label">Password</label>
          <input type="password" id="inputPassword5" class="form-control" aria-describedby="passwordHelpBlock">
          <div id="passwordHelpBlock" class="form-text">
            Your password must be 8-20 characters long, contain letters and numbers, and must not contain spaces,
            special characters, or emoji.
          </div>
        </div>
        <!-- radio -->
        <div class="mb-3">
          <div class="form-check">
            <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault1">
            <label class="form-check-label" for="flexRadioDefault1">
              Default radio
            </label>
          </div>
        </div>
        <!-- dropdowm -->
        <div class="mb-3">
          <div class="dropdown">
            <a class="btn btn-secondary dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
              aria-expanded="false">
              Dropdown link
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="#">Action</a></li>
              <li><a class="dropdown-item" href="#">Another action</a></li>
              <li><a class="dropdown-item" href="#">Something else here</a></li>
            </ul>
          </div>
        </div>
        <!-- checkbox -->
        <div class="mb-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault">
            <label class="form-check-label" for="flexCheckDefault">
              Default checkbox
            </label>
          </div>
        </div>
        <!-- file -->
        <div class="mb-3">
          <label for="formFile" class="form-label">Default file input example</label>
          <input class="form-control" type="file" id="formFile">
        </div>
        <!-- numbber -->
        <div class="mb-3">
          <input class="form-control" type="number" placeholder="Default input" aria-label="default input example">
        </div>
        <!-- date -->
        <div class="form-field floating-label">
          <div class="field">
            <input type="date" placeholder="" class="form-control" id="myDateField" />
            <label>Date of birth*</label>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
